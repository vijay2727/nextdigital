databases:
  - name: digitalnext-postgres
    databaseName: digitalnext
    user: digitalnext_user
    plan: free

services:
  - type: web
    name: digitalnext-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: digitalnext-postgres
          property: connectionString
